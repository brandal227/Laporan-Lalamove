<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Lalamove Dinamis</title>
    <!-- Google Fonts Inter untuk kesan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f37021;
            --primary-hover: #d95e14;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px 10px;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05), 0 2px 6px -2px rgba(0, 0, 0, 0.03);
        }

        /* Navigasi Atas yang Lebih Rapinya Terstruktur */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-nav {
            background-color: #00b14f;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-nav:hover {
            background-color: #009541;
        }

        .btn-json {
            background-color: #3182ce;
        }
        .btn-json:hover {
            background-color: #2b6cb0;
        }

        h1.main-title {
            text-align: center;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        /* Kontainer gabungan untuk filter dan tombol aksi */
        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
        }

        .filter-bar select, .filter-bar input, table select {
            padding: 6px 10px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .filter-bar select:focus, .filter-bar input:focus, table select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(243, 112, 33, 0.15);
        }

        /* Warna Khusus untuk Dropdown & Teks Berdasarkan Pilihan */
        select.transaksi-select option[value="Argo kotor"],
        select.transaksi-select.color-argo-kotor,
        .text-argo-kotor {
            color: #2563eb !important; /* Biru */
            font-weight: 600;
        }

        select.transaksi-select option[value="Potongan aplikasi"],
        select.transaksi-select.color-potongan-aplikasi,
        .text-potongan-aplikasi {
            color: #ef4444 !important; /* Merah */
            font-weight: 600;
        }

        select.transaksi-select option[value="Bbm"],
        select.transaksi-select.color-bbm,
        .text-bbm {
            color: #f97316 !important; /* Oren Jingga */
            font-weight: 600;
        }

        .action-bar {
            display: flex;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 2px 4px -1px rgba(243, 112, 33, 0.2);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(243, 112, 33, 0.3);
        }

        .btn-delete {
            background-color: #fee2e2;
            color: var(--danger);
            padding: 4px 8px;
            font-size: 11px;
            box-shadow: none;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
            transform: none;
            box-shadow: none;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            text-align: left;
        }

        th, td {
            padding: 8px 12px;
            font-size: 13px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        td {
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #fcfcfc;
        }

        td.text-right, th.text-right {
            text-align: right;
        }

        td.text-center, th.text-center {
            text-align: center;
        }

        td[contenteditable="true"] {
            transition: background-color 0.15s ease;
        }

        td[contenteditable="true"]:hover {
            background-color: #fffbeb;
        }

        td[contenteditable="true"]:focus {
            background-color: #fffbeb;
            outline: 2px solid var(--primary);
            border-radius: 4px;
        }

        #notification {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 500;
            color: #10b981;
            height: 12px;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tombol Navigasi & Backup/Restore JSON yang Dikelompokkan Rapi -->
        <div class="top-nav">
            <div class="nav-group">
                <button class="btn-nav btn-json" onclick="downloadJSON()">踏 Download JSON</button>
                <button class="btn-nav btn-json" onclick="document.getElementById('importJsonFile').click()">豆 Upload JSON</button>
                <input type="file" id="importJsonFile" style="display: none;" accept=".json" onchange="uploadJSON(event)">
            </div>
            <div class="nav-group">
                <a href="dashboard.html" class="btn-nav">投 Buka Laporan Ringkasan</a>
            </div>
        </div>

        <h1 class="main-title" id="mainTitle">Master data Laporan Lalamove</h1>
        
        <!-- Wrapper untuk Filter Bulan/Tahun di Kiri dan Tombol Tambah Baris di Kanan -->
        <div class="controls-wrapper">
            <div class="filter-bar">
                <select id="selectBulan" onchange="changePeriod()">
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September">September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November">November</option>
                    <option value="Desember">Desember</option>
                </select>
                <input type="number" id="inputTahun" value="2026" style="width: 80px;" onchange="changePeriod()">
            </div>

            <div class="action-bar">
                <button class="btn" onclick="addRow()">+ Tambah Baris</button>
            </div>
        </div>

        <div class="table-responsive">
            <table id="laporanTable">
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Jenis Transaksi</th>
                        <th class="text-right">Nominal</th>
                        <th class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data dinamis dimuat via script -->
                </tbody>
            </table>
        </div>
        
        <div id="notification"></div>
    </div>

    <script>
        const table = document.getElementById('laporanTable').getElementsByTagName('tbody')[0];
        const notification = document.getElementById('notification');
        const selectBulan = document.getElementById('selectBulan');
        const inputTahun = document.getElementById('inputTahun');
        const mainTitle = document.getElementById('mainTitle');

        selectBulan.value = "Juni";
        inputTahun.value = "2026";

        const defaultData = [
            ["01 Des 25", "Argo kotor", "Rp 100,000.00"],
            ["", "Argo kotor", "Rp 150,000.00"],
            ["02 Des 25", "Argo kotor", "Rp 70,000.00"],
            ["", "Potongan aplikasi", ""],
            ["", "Argo kotor", "Rp 100,000.00"],
            ["", "Potongan aplikasi", ""],
            ["", "Argo kotor", "Rp 58,129.00"],
            ["", "Potongan aplikasi", ""],
            ["", "Bonus stiker", "Rp 200,000.00"],
            ["", "Bbm", ""]
        ];

        function getStorageKey() {
            const bulan = selectBulan.value.toLowerCase();
            const tahun = inputTahun.value;
            return `laporan_lalamove_${bulan}_${tahun}`;
        }

        function updateTitle() {
            mainTitle.innerText = `Master data Laporan Lalamove ${selectBulan.value} ${inputTahun.value}`;
        }

        function renderTable(rowsData) {
            table.innerHTML = "";
            rowsData.forEach(rowData => {
                let nominalVal = rowData[2];
                if ((!nominalVal || nominalVal === "") && rowData[3] && rowData[3] !== "") {
                    nominalVal = rowData[3];
                }
                insertRowToDOM(rowData[0], rowData[1], nominalVal);
            });
        }

        function updateRowColors(selectElement) {
            const row = selectElement.closest('tr');
            const currencyInputs = row.querySelectorAll('.currency-input');
            
            // Hapus kelas warna lama dari select dan input nominal
            selectElement.classList.remove('color-argo-kotor', 'color-potongan-aplikasi', 'color-bbm');
            currencyInputs.forEach(input => {
                input.classList.remove('text-argo-kotor', 'text-potongan-aplikasi', 'text-bbm');
            });

            // Tambahkan kelas warna baru berdasarkan nilai dropdown yang dipilih
            const val = selectElement.value;
            let colorClass = '';
            if (val === 'Argo kotor') colorClass = 'color-argo-kotor';
            else if (val === 'Potongan aplikasi') colorClass = 'color-potongan-aplikasi';
            else if (val === 'Bbm') colorClass = 'color-bbm';

            if (colorClass) {
                selectElement.classList.add(colorClass);
                currencyInputs.forEach(input => {
                    input.classList.add(colorClass.replace('color-', 'text-'));
                });
            }
        }

        function insertRowToDOM(tanggal = "", jenisTransaksi = "", nominal = "") {
            const newRow = table.insertRow();
            
            const optionsList = ["Argo kotor", "Potongan aplikasi", "Bbm", "Bonus stiker"];
            let optionsHtml = `<option value="" disabled ${!jenisTransaksi ? 'selected' : ''}>Pilih Jenis Transaksi</option>`;
            
            optionsList.forEach(opt => {
                const selected = (jenisTransaksi === opt) ? 'selected' : '';
                optionsHtml += `<option value="${opt}" ${selected}>${opt}</option>`;
            });

            newRow.innerHTML = `
                <td contenteditable="true">${tanggal}</td>
                <td>
                    <select class="transaksi-select" onchange="handleSelectChange(this)">
                        ${optionsHtml}
                    </select>
                </td>
                <td contenteditable="true" inputmode="numeric" class="text-right currency-input">${nominal}</td>
                <td class="text-center">
                    <button class="btn btn-delete" onclick="deleteRow(this)">Hapus</button>
                </td>
            `;

            // Terapkan warna saat baris dimuat jika sudah ada pilihan jenis transaksinya
            const selectEl = newRow.querySelector('.transaksi-select');
            if (jenisTransaksi) {
                updateRowColors(selectEl);
            }
        }

        function handleSelectChange(selectElement) {
            updateRowColors(selectElement);
            saveTableData();
        }

        function loadTableData() {
            updateTitle();
            const STORAGE_KEY = getStorageKey();
            const savedData = localStorage.getItem(STORAGE_KEY);
            
            if (savedData) {
                renderTable(JSON.parse(savedData));
            } else {
                if (selectBulan.value === "Juni" && inputTahun.value === "2026") {
                    renderTable(defaultData);
                } else {
                    renderTable([]);
                }
            }
        }

        function changePeriod() {
            loadTableData();
        }

        function addRow() {
            insertRowToDOM("", "", "");
            saveTableData();
        }

        function deleteRow(button) {
            const row = button.closest('tr');
            row.remove();
            saveTableData();
        }

        document.getElementById('laporanTable').addEventListener('input', function(e) {
            if (e.target.classList.contains('currency-input')) {
                let el = e.target;
                let value = el.innerText.replace(/[^0-9]/g, '');
                
                if (value === "") {
                    el.innerText = "";
                } else {
                    let formatted = Number(value).toLocaleString('id-ID');
                    el.innerText = "Rp " + formatted;
                    
                    let range = document.createRange();
                    let sel = window.getSelection();
                    range.selectNodeContents(el);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }
            saveTableData();
        });

        function saveTableData() {
            const STORAGE_KEY = getStorageKey();
            const rowsData = [];
            const rows = table.querySelectorAll('tr');

            rows.forEach(row => {
                const rowData = [];
                const tanggalCell = row.querySelectorAll('td')[0];
                const selectCell = row.querySelector('td select');
                const nominalCell = row.querySelectorAll('td')[2];

                rowData.push(tanggalCell.innerText);
                rowData.push(selectCell ? selectCell.value : "");
                rowData.push(nominalCell.innerText);

                rowsData.push(rowData);
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(rowsData));
            
            notification.innerText = "Perubahan tersimpan otomatis...";
            setTimeout(() => {
                notification.innerText = "";
            }, 1500);
        }

        function downloadJSON() {
            const exportData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('laporan_lalamove_') || key.startsWith('lalamove_bonus_')) {
                    exportData[key] = localStorage.getItem(key);
                }
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_lalamove_${selectBulan.value}_${inputTahun.value}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function uploadJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    for (const key in importedData) {
                        if (importedData.hasOwnProperty(key)) {
                            localStorage.setItem(key, importedData[key]);
                        }
                    }
                    alert("Data JSON berhasil di-upload dan dipulihkan!");
                    loadTableData();
                } catch (error) {
                    alert("Format file JSON tidak valid!");
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = "";
        }

        window.onload = loadTableData;
    </script>
</body>
</html>
