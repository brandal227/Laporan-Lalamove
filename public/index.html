<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Lalamove Dinamis</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f37021;
            --primary-hover: #d95e14;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px 10px;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05), 0 2px 6px -2px rgba(0, 0, 0, 0.03);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-nav {
            background-color: #00b14f;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-nav:hover {
            background-color: #009541;
        }

        .btn-json {
            background-color: #3182ce;
        }
        .btn-json:hover {
            background-color: #2b6cb0;
        }

        h1.main-title {
            text-align: center;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
        }

        .filter-bar select, .filter-bar input {
            padding: 6px 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        /* Styling teks & warna untuk jenis transaksi tanpa border */
        .transaksi-trigger {
            cursor: pointer;
            padding: 6px 4px;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            display: inline-block;
            outline: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .transaksi-trigger:hover {
            background-color: #f1f5f9;
        }

        .text-argo-kotor {
            color: #2563eb !important;
            font-weight: 600;
        }

        .text-potongan-aplikasi {
            color: #ef4444 !important;
            font-weight: 600;
        }

        .text-bbm {
            color: #f97316 !important;
            font-weight: 600;
        }

        .text-placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        .action-bar {
            display: flex;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 2px 4px -1px rgba(243, 112, 33, 0.2);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-delete {
            background-color: #fee2e2;
            color: var(--danger);
            padding: 4px 8px;
            font-size: 11px;
            box-shadow: none;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            text-align: left;
        }

        th, td {
            padding: 8px 12px;
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 14px;
        }

        td {
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tbody tr:hover {
            background-color: #fcfcfc;
        }

        td.text-right, th.text-right {
            text-align: right;
        }

        td.text-center, th.text-center {
            text-align: center;
        }

        td.date-cell {
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        td.date-cell:hover {
            background-color: #fffbeb;
        }

        #notification {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 500;
            color: #10b981;
            height: 12px;
        }

        /* Styling Modal / Popup Pilihan */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            width: 280px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: modalPop 0.2s ease-out;
        }

        @keyframes modalPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-option {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            color: var(--text-main);
        }

        .modal-option:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .modal-option.opt-argo-kotor { color: #2563eb; font-weight: 600; }
        .modal-option.opt-potongan-aplikasi { color: #ef4444; font-weight: 600; }
        .modal-option.opt-bbm { color: #f97316; font-weight: 600; }

        @media (max-width: 640px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 12px 10px;
                border-radius: 8px;
            }

            h1.main-title {
                font-size: 16px;
                margin-bottom: 10px;
            }

            .controls-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 8px 10px;
            }

            .filter-bar {
                width: 100%;
                justify-content: space-between;
            }

            .filter-bar select {
                flex: 1;
            }

            .action-bar {
                width: 100%;
            }

            .action-bar button {
                width: 100%;
                text-align: center;
                padding: 8px;
            }

            .top-nav {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-group {
                width: 100%;
                justify-content: space-between;
            }

            .nav-group .btn-nav {
                flex: 1;
                justify-content: center;
            }

            th, td {
                padding: 6px 8px;
                font-size: 12px;
            }

            .filter-bar select, .filter-bar input {
                font-size: 12px;
                padding: 5px 6px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <div class="nav-group">
                <button class="btn-nav btn-json" onclick="downloadJSON()">Download JSON</button>
                <button class="btn-nav btn-json" onclick="document.getElementById('importJsonFile').click()">Upload JSON</button>
                <input type="file" id="importJsonFile" style="display: none;" accept=".json" onchange="uploadJSON(event)">
            </div>
            <div class="nav-group">
                <a href="dashboard.html" class="btn-nav">Buka Laporan Ringkasan</a>
            </div>
        </div>

        <h1 class="main-title" id="mainTitle">Master Data Laporan Lalamove</h1>
        
        <div class="controls-wrapper">
            <div class="filter-bar">
                <select id="selectBulan" onchange="changePeriod()">
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September">September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November">November</option>
                    <option value="Desember">Desember</option>
                </select>
                <input type="number" id="inputTahun" value="2026" style="width: 80px;" onchange="changePeriod()">
            </div>

            <div class="action-bar">
                <button class="btn" onclick="addRow()">+ Tambah Baris</button>
            </div>
        </div>

        <div class="table-responsive">
            <table id="laporanTable">
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Jenis Transaksi</th>
                        <th class="text-right">Nominal</th>
                        <th class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        
        <div id="notification"></div>
    </div>

    <!-- Hidden Date Input untuk Kalender -->
    <input type="date" id="hiddenDateInput" style="position: absolute; opacity: 0; pointer-events: none;" onchange="onDatePicked(this)">

    <!-- Custom Popup / Modal Pilihan Transaksi -->
    <div id="transactionModal" class="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <div class="modal-title">Pilih Jenis Transaksi</div>
            <button class="modal-option opt-argo-kotor" onclick="selectTransaction('Argo kotor')">Argo kotor</button>
            <button class="modal-option opt-potongan-aplikasi" onclick="selectTransaction('Potongan aplikasi')">Potongan aplikasi</button>
            <button class="modal-option opt-bbm" onclick="selectTransaction('Bbm')">Bbm</button>
            <button class="modal-option" onclick="selectTransaction('Bonus stiker')">Bonus stiker</button>
        </div>
    </div>

    <script>
        const table = document.getElementById('laporanTable').getElementsByTagName('tbody')[0];
        const notification = document.getElementById('notification');
        const selectBulan = document.getElementById('selectBulan');
        const inputTahun = document.getElementById('inputTahun');
        const mainTitle = document.getElementById('mainTitle');
        const hiddenDateInput = document.getElementById('hiddenDateInput');
        const transactionModal = document.getElementById('transactionModal');
        
        let activeDateCell = null;
        let activeTriggerButton = null;
        let pressTimer = null;

        // --- INISIALISASI OTOMATIS BULAN & TAHUN SAAT INI ---
        function setOtomatisPeriodeSekarang() {
            const namaBulan = [
                "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
                "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ];
            const sekarang = new Date();
            selectBulan.value = namaBulan[sekarang.getMonth()];
            inputTahun.value = sekarang.getFullYear();
        }

        function getStorageKey() {
            const bulan = selectBulan.value.toLowerCase();
            const tahun = inputTahun.value;
            return `laporan_lalamove_${bulan}_${tahun}`;
        }

        function updateTitle() {
            mainTitle.innerText = `Master Data Laporan Lalamove ${selectBulan.value} ${inputTahun.value}`;
        }

        function renderTable(rowsData) {
            table.innerHTML = "";
            rowsData.forEach(rowData => {
                let nominalVal = rowData[2];
                if ((!nominalVal || nominalVal === "") && rowData[3] && rowData[3] !== "") {
                    nominalVal = rowData[3];
                }
                insertRowToDOM(rowData[0], rowData[1], nominalVal);
            });
        }

        function updateRowColors(triggerEl, value) {
            const row = triggerEl.closest('tr');
            const currencyInput = row.querySelector('.currency-input');
            
            triggerEl.classList.remove('text-argo-kotor', 'text-potongan-aplikasi', 'text-bbm', 'text-placeholder');
            if (currencyInput) {
                currencyInput.classList.remove('text-argo-kotor', 'text-potongan-aplikasi', 'text-bbm');
            }

            if (!value) {
                triggerEl.innerText = "Pilih Jenis Transaksi";
                triggerEl.classList.add('text-placeholder');
                return;
            }

            triggerEl.innerText = value;
            let colorClass = '';
            if (value === 'Argo kotor') colorClass = 'text-argo-kotor';
            else if (value === 'Potongan aplikasi') colorClass = 'text-potongan-aplikasi';
            else if (value === 'Bbm') colorClass = 'text-bbm';

            if (colorClass) {
                triggerEl.classList.add(colorClass);
                if (currencyInput) {
                    currencyInput.classList.add(colorClass);
                }
            }
        }

        function insertRowToDOM(tanggal = "", jenisTransaksi = "", nominal = "") {
            const newRow = table.insertRow();

            newRow.innerHTML = `
                <td class="date-cell" title="Klik untuk ubah, Tekan lama (hold) untuk hapus tanggal">${tanggal}</td>
                <td>
                    <button type="button" class="transaksi-trigger" onclick="openModal(this)"></button>
                </td>
                <td contenteditable="true" inputmode="numeric" class="text-right currency-input">${nominal}</td>
                <td class="text-center">
                    <button class="btn btn-delete" onclick="deleteRow(this)">Hapus</button>
                </td>
            `;

            const cell = newRow.querySelector('.date-cell');
            cell.addEventListener('click', function(e) {
                openCalendar(this);
            });

            cell.addEventListener('mousedown', function(e) { startLongPress(this); });
            cell.addEventListener('touchstart', function(e) { startLongPress(this); });
            cell.addEventListener('mouseup', cancelLongPress);
            cell.addEventListener('mouseleave', cancelLongPress);
            cell.addEventListener('touchend', cancelLongPress);
            cell.addEventListener('touchmove', cancelLongPress);

            const triggerEl = newRow.querySelector('.transaksi-trigger');
            updateRowColors(triggerEl, jenisTransaksi);
        }

        // --- FUNGSI MODAL / POPUP PILIHAN ---
        function openModal(triggerBtn) {
            activeTriggerButton = triggerBtn;
            transactionModal.style.display = 'flex';
        }

        function closeModal() {
            transactionModal.style.display = 'none';
            activeTriggerButton = null;
        }

        function closeModalOutside(e) {
            if (e.target === transactionModal) {
                closeModal();
            }
        }

        function selectTransaction(value) {
            if (activeTriggerButton) {
                updateRowColors(activeTriggerButton, value);
                saveTableData();
            }
            closeModal();
        }

        function startLongPress(cell) {
            cancelLongPress();
            pressTimer = setTimeout(function() {
                if (cell.innerText.trim() !== "") {
                    if (confirm("Apakah Anda ingin menghapus tanggal ini?")) {
                        cell.innerText = "";
                        saveTableData();
                    }
                }
            }, 600);
        }

        function cancelLongPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        function openCalendar(cell) {
            activeDateCell = cell;
            if (typeof hiddenDateInput.showPicker === 'function') {
                hiddenDateInput.showPicker();
            } else {
                hiddenDateInput.click();
            }
        }

        function onDatePicked(input) {
            if (!activeDateCell) return;
            const val = input.value; 
            if (val) {
                const parts = val.split('-');
                const year = parts[0].slice(-2);
                const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
                const monthIndex = parseInt(parts[1], 10) - 1;
                const day = parseInt(parts[2], 10);
                
                const formattedDate = `${day < 10 ? '0' + day : day} ${monthNames[monthIndex]} ${year}`;
                activeDateCell.innerText = formattedDate;
                saveTableData();
            }
            input.value = "";
        }

        function loadTableData() {
            updateTitle();
            const STORAGE_KEY = getStorageKey();
            const savedData = localStorage.getItem(STORAGE_KEY);
            
            if (savedData) {
                renderTable(JSON.parse(savedData));
            } else {
                renderTable([]);
            }
        }

        function changePeriod() {
            loadTableData();
        }

        function addRow() {
            insertRowToDOM("", "", "");
            saveTableData();
        }

        function deleteRow(button) {
            const row = button.closest('tr');
            row.remove();
            saveTableData();
        }

        document.getElementById('laporanTable').addEventListener('input', function(e) {
            if (e.target.classList.contains('currency-input')) {
                let el = e.target;
                let value = el.innerText.replace(/[^0-9]/g, '');
                
                if (value === "") {
                    el.innerText = "";
                } else {
                    let formatted = Number(value).toLocaleString('id-ID');
                    el.innerText = "Rp " + formatted;
                    
                    let range = document.createRange();
                    let sel = window.getSelection();
                    range.selectNodeContents(el);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }
            saveTableData();
        });

        function saveTableData() {
            const STORAGE_KEY = getStorageKey();
            const rowsData = [];
            const rows = table.querySelectorAll('tr');

            rows.forEach(row => {
                const rowData = [];
                const tanggalCell = row.querySelectorAll('td')[0];
                const triggerEl = row.querySelector('.transaksi-trigger');
                const nominalCell = row.querySelectorAll('td')[2];

                rowData.push(tanggalCell.innerText);
                let jenisVal = (triggerEl && !triggerEl.classList.contains('text-placeholder')) ? triggerEl.innerText : "";
                rowData.push(jenisVal);
                rowData.push(nominalCell.innerText);

                rowsData.push(rowData);
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(rowsData));
            
            notification.innerText = "Perubahan tersimpan otomatis...";
            setTimeout(() => {
                notification.innerText = "";
            }, 1500);
        }

        function downloadJSON() {
            const exportData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('laporan_lalamove_') || key.startsWith('lalamove_bonus_')) {
                    exportData[key] = localStorage.getItem(key);
                }
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_lalamove_${selectBulan.value}_${inputTahun.value}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function uploadJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    for (const key in importedData) {
                        if (importedData.hasOwnProperty(key)) {
                            localStorage.setItem(key, importedData[key]);
                        }
                    }
                    alert("Data JSON berhasil di-upload dan dipulihkan!");
                    loadTableData();
                } catch (error) {
                    alert("Format file JSON tidak valid!");
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = "";
        }

        // Jalankan saat halaman dimuat
        window.onload = function() {
            setOtomatisPeriodeSekarang();
            loadTableData();
        };
    </script>
</body>
</html>
